---
- name: Create proxy system group
  ansible.builtin.group:
    name: "{{ proxy_group }}"
    system: true
    state: present

- name: Create proxy system user
  ansible.builtin.user:
    name: "{{ proxy_user }}"
    group: "{{ proxy_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ proxy_install_dir }}"
    create_home: false
    state: present

- name: Create proxy install directory
  ansible.builtin.file:
    path: "{{ proxy_install_dir }}"
    state: directory
    owner: "{{ proxy_user }}"
    group: "{{ proxy_group }}"
    mode: "0755"

- name: Mark install directory as git safe.directory
  community.general.git_config:
    name: safe.directory
    scope: global
    value: "{{ proxy_install_dir }}"

- name: Clone / update shard-proxy repository
  ansible.builtin.git:
    repo: "{{ proxy_repo }}"
    dest: "{{ proxy_install_dir }}"
    version: "{{ proxy_version }}"
    force: false
  when: proxy_local_binary | default('') | length == 0

- name: Push pre-built proxy binary (skips git/build)
  ansible.builtin.copy:
    src: "{{ proxy_local_binary }}"
    dest: "{{ proxy_install_dir }}/shard-proxy"
    owner: "{{ proxy_user }}"
    group: "{{ proxy_group }}"
    mode: "0755"
  when: proxy_local_binary | default('') | length > 0

- name: Set ownership of install directory after clone
  ansible.builtin.file:
    path: "{{ proxy_install_dir }}"
    owner: "{{ proxy_user }}"
    group: "{{ proxy_group }}"
    recurse: true
  when: proxy_local_binary | default('') | length == 0

- name: Stat existing proxy binary in install dir
  ansible.builtin.stat:
    path: "{{ proxy_install_dir }}/shard-proxy"
  register: proxy_binary_stat
  when: proxy_local_binary | default('') | length == 0

- name: Read the installed Go toolchain version
  ansible.builtin.command: "{{ go_install_dir }}/bin/go env GOVERSION"
  environment:
    GOTOOLCHAIN: local
  register: proxy_go_installed
  changed_when: false
  check_mode: false
  failed_when: false
  when: proxy_local_binary | default('') | length == 0

# A run limited by tags skips the common role, which installs Go. Building
# with another release would miss the pinned toolchain and rebuild every run.
- name: Require the pinned Go toolchain for source builds
  ansible.builtin.assert:
    that:
      - proxy_go_installed.stdout | default('') | trim == 'go' ~ go_version
    fail_msg: >-
      {{ go_install_dir }} holds {{ proxy_go_installed.stdout | default('no Go') }},
      not go{{ go_version }}. Run the common role first (the play without tags, or with the common tag).
  # A dry run installs nothing, so the toolchain it reads may be the one about to be replaced.
  when:
    - proxy_local_binary | default('') | length == 0
    - not ansible_check_mode

- name: Read the Go version the existing binary was built with
  ansible.builtin.command: "{{ go_install_dir }}/bin/go version {{ proxy_install_dir }}/shard-proxy"
  register: proxy_binary_go
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - proxy_local_binary | default('') | length == 0
    - proxy_binary_stat.stat.exists

- name: Build shard-proxy binary
  ansible.builtin.command:
    # Folded scalar: the one-line form ran past the 160-char lint limit. Folding
    # joins these lines with single spaces, so the command string is unchanged.
    cmd: >-
      {{ go_install_dir }}/bin/go build -buildvcs=false
      -ldflags "-s -w -X github.com/lightwebinc/shard-proxy/metrics.Version={{ proxy_version }}"
      -o {{ proxy_install_dir }}/shard-proxy .
    chdir: "{{ proxy_install_dir }}"
  environment:
    PATH: "{{ go_install_dir }}/bin:{{ ansible_env.PATH }}"
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local
    GOOS: "{{ 'freebsd' if ansible_os_family == 'FreeBSD' else 'linux' }}"
    GOARCH: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    HOME: "/tmp"
    GOPATH: "/tmp/gopath"
    GOCACHE: "/tmp/gocache"
  changed_when: true
  when:
    - proxy_local_binary | default('') | length == 0
    # A binary built with another Go release is rebuilt, so a toolchain move
    # reaches a deployed node without proxy_force_build.
    - >-
      not proxy_binary_stat.stat.exists
      or (proxy_force_build | default(false) | bool)
      or (proxy_binary_go.stdout | default('')).split() | last | default('') != 'go' ~ go_version

- name: Set ownership on pushed/built binary
  ansible.builtin.file:
    path: "{{ proxy_install_dir }}/shard-proxy"
    owner: "{{ proxy_user }}"
    group: "{{ proxy_group }}"
    mode: "0755"

- name: Install binary to system bin dir
  ansible.builtin.copy:
    src: "{{ proxy_install_dir }}/shard-proxy"
    dest: "{{ proxy_bin_dir }}/shard-proxy"
    remote_src: true
    owner: root
    group: "{{ proxy_group }}"
    mode: "0755"
  notify: Restart shard-proxy

- name: Create config directory
  ansible.builtin.file:
    path: "{{ '/usr/local/etc' if ansible_os_family == 'FreeBSD' else '/etc/shard-proxy' }}"
    state: directory
    owner: root
    group: "{{ proxy_group }}"
    mode: "0750"

- name: Deploy environment config file
  ansible.builtin.template:
    src: config.env.j2
    dest: "{{ '/usr/local/etc/shard-proxy.conf' if ansible_os_family == 'FreeBSD' else '/etc/shard-proxy/config.env' }}"
    owner: root
    group: "{{ proxy_group }}"
    mode: "0640"
  notify: Restart shard-proxy

- name: Deploy systemd service unit (Linux)
  ansible.builtin.template:
    src: shard-proxy.service.j2
    dest: /etc/systemd/system/shard-proxy.service
    owner: root
    group: root
    mode: "0644"
  when: ansible_os_family != 'FreeBSD'
  notify:
    - Reload systemd
    - Restart shard-proxy

- name: Deploy rc.d service script (FreeBSD)
  ansible.builtin.template:
    src: shard_proxy.rc.j2
    dest: /usr/local/etc/rc.d/shard_proxy
    owner: root
    group: wheel
    mode: "0755"
  when: ansible_os_family == 'FreeBSD'
  notify: Restart shard-proxy

- name: Enable and start shard-proxy (Linux)
  ansible.builtin.systemd:
    name: shard-proxy
    enabled: true
    state: started
  when: ansible_os_family != 'FreeBSD'

- name: Enable shard-proxy in rc.conf (FreeBSD)
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: '^shard_proxy_enable='
    line: 'shard_proxy_enable="YES"'
  when: ansible_os_family == 'FreeBSD'

- name: Start shard-proxy (FreeBSD)
  ansible.builtin.service:
    name: shard_proxy
    state: started
  when: ansible_os_family == 'FreeBSD'
