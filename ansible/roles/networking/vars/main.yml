---
# Internal role variables, not intended to be overridden by users.
# Use group_vars/all.yml (mc_route_prefix, mc_scope) for configuration.

# Egress interface name (first entry when a list is given).
networking_egress_iface: "{{ egress_iface if egress_iface is string else egress_iface[0] }}"

# FreeBSD: the interface the role configures and restarts when that changes.
# GRE mode always names the tunnel gif0.
networking_data_iface: "{{ 'gif0' if egress_mode == 'gre' else networking_egress_iface }}"

# FreeBSD GRE: the outer source and destination of gif0's tunnel.
networking_gre_tunnel: ["{{ gre_local_ip6 }}", "{{ gre_remote_ip6 }}"]

# FreeBSD: per interface, the settings this role writes to rc.conf for it. A
# restart applies them, and networking_netif_state_file records what the last
# successful restart applied: an interface whose entry differs is restarted.
networking_netif_desired: >-
  {{ {networking_data_iface: ('gre ' ~ (networking_gre_tunnel | join(' ')) ~ ' ' ~ gre_inner_ipv6)
                             if egress_mode == 'gre' else 'ethernet'}
     | combine({'lo0': 'vip ' ~ bgp_vip ~ ' ' ~ bgp_vip6}
               if (enable_bgp | bool and (bgp_vip ~ bgp_vip6) | length > 0) else {}) }}
networking_netif_state_file: /var/db/ingress-infra-netif.json

# Resolved multicast route prefix: honor explicit override, else derive from scope.
networking_mc_route_prefix: "{{ mc_route_prefix if mc_route_prefix | length > 0 else networking_mc_scope_prefix_map[mc_scope] }}"

# Map mc_scope keyword to the corresponding FF0x::/16 multicast prefix.
networking_mc_scope_prefix_map:
  link: "ff02::/16"
  site: "ff05::/16"
  org: "ff08::/16"
  global: "ff0e::/16"
