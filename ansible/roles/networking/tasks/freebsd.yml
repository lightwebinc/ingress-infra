---
# Every task that changes interface configuration registers its result: only the
# interfaces whose configuration changed are restarted (see "Restart changed
# interfaces" below).
- name: Enable IPv4/IPv6 forwarding in rc.conf (FreeBSD)
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^ipv6_enable=', line: 'ipv6_enable="YES"' }
    - { regexp: '^gateway_enable=', line: 'gateway_enable="YES"' }
    - { regexp: '^ipv6_gateway_enable=', line: 'ipv6_gateway_enable="YES"' }
  register: networking_rc_base

- name: Configure dual-stack ingress interface in rc.conf (ethernet, FreeBSD)
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - regexp: "^ifconfig_{{ egress_iface if egress_iface is string else egress_iface[0] }}="
      line: >-
        ifconfig_{{ egress_iface if egress_iface is string else egress_iface[0] }}="DHCP"
    - regexp: "^ifconfig_{{ egress_iface if egress_iface is string else egress_iface[0] }}_ipv6="
      line: >-
        ifconfig_{{ egress_iface if egress_iface is string else egress_iface[0] }}_ipv6="inet6 accept_rtadv"
  when: egress_mode == 'ethernet'
  register: networking_rc_iface

- name: Configure IPv6 GRE (gif) tunnel in rc.conf (FreeBSD)
  ansible.builtin.blockinfile:
    path: /etc/rc.conf
    marker: "# {mark} ingress-infra GRE tunnel"
    block: |
      ifconfig_gif0="tunnel {{ gre_local_ip6 }} {{ gre_remote_ip6 }}"
      ifconfig_gif0_ipv6="inet6 {{ gre_inner_ipv6 }}"
  when: egress_mode == 'gre'
  register: networking_rc_gre

# Appended, never assigned: a cloned_interfaces line of its own would replace the
# list an operator keeps (lagg0, vlan0, ...), and those interfaces would no longer
# be created at boot. After the block above, so a cloned_interfaces line an older
# version of this role wrote inside the block is already gone.
- name: List gif0 in cloned_interfaces (FreeBSD)
  community.general.sysrc:
    path: /etc/rc.conf
    name: cloned_interfaces
    value: gif0
    state: value_present
  when: egress_mode == 'gre'
  register: networking_rc_clone

- name: Configure IPv4 BGP loopback VIP in rc.conf (FreeBSD)
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: '^ifconfig_lo0_alias0='
    line: 'ifconfig_lo0_alias0="inet {{ bgp_vip }} netmask 255.255.255.255"'
  when: enable_bgp | bool and bgp_vip | length > 0
  register: networking_rc_vip4

- name: Configure IPv6 BGP loopback VIP in rc.conf (FreeBSD)
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: '^ifconfig_lo0_alias1='
    line: 'ifconfig_lo0_alias1="inet6 {{ bgp_vip6 }} prefixlen 128"'
  when: enable_bgp | bool and bgp_vip6 | length > 0
  register: networking_rc_vip6

- name: Add persistent multicast route for egress interface in rc.conf (FreeBSD)
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: '^ipv6_route_bsp_mcast='
    line: 'ipv6_route_bsp_mcast="{{ networking_mc_route_prefix }} -interface {{ networking_egress_iface }}"'

# rc.d/routing installs only the routes named in ipv6_static_routes, so the
# ipv6_route_bsp_mcast line alone does nothing at boot. value_present appends
# the name, keeps the names already listed and never adds it twice.
- name: List the multicast route in ipv6_static_routes (FreeBSD)
  community.general.sysrc:
    path: /etc/rc.conf
    name: ipv6_static_routes
    value: bsp_mcast
    state: value_present

# Compared on every run, not only after a change: gif0 can be missing, down, or
# run another tunnel or inner address, with nothing left to change (destroyed,
# downed or reconfigured by hand, or a converge stopped before its restart), and
# the live route below needs it. gif_status (this role's library/) compares by value.
- name: Check gif0 against its configuration (GRE, FreeBSD)
  gif_status:
    name: gif0
    tunnel: "{{ networking_gre_tunnel }}"
    inet6: "{{ gre_inner_ipv6 }}"
  register: networking_gif0_probe
  when: egress_mode == 'gre'

# What the last successful restart applied, per interface (written below). A run
# that wrote rc.conf and stopped before the restart leaves the running interface
# behind rc.conf with nothing left to change; the record still differs from
# networking_netif_desired, so the next run restarts it.
- name: Read the applied interface state (FreeBSD)
  ansible.builtin.slurp:
    src: "{{ networking_netif_state_file }}"
  register: networking_netif_applied
  failed_when: false

# Only the interfaces whose configuration changed, is not applied yet, or (gif0)
# is not running it, each by name. A bare `service netif restart` would also
# destroy and re-create every other listed clone, an operator's epair0 under a
# running jail for one, and bounce the management interface. Restarting gif0
# destroys and re-creates it, which drops every route through it, so the live
# route goes in after this. The route line and its ipv6_static_routes entry above
# are boot-time records that need no restart. The command, not the service
# module: on FreeBSD that module puts `arguments` before the script name
# (`service gif0 netif restart`). A task, not a handler: flushing handlers here
# would also run the service roles' pending restarts first, under a gif0 about
# to be destroyed, and an end-of-play handler would run after the live route.
- name: Restart changed interfaces (FreeBSD)
  ansible.builtin.command:
    argv: [service, netif, restart, "{{ item }}"]
  changed_when: true
  loop: "{{ networking_netif_restart }}"
  vars:
    networking_netif_restart: >-
      {{ (((networking_netif_desired.items() | map('join', '|') | list)
           | difference((networking_netif_applied.content | default('e30=') | b64decode | from_json).items()
                        | map('join', '|') | list)
           | map('split', '|') | map('first') | list)
          + ([networking_data_iface]
             if (networking_rc_base is changed or networking_rc_iface is changed
                 or networking_rc_gre is changed or networking_rc_clone is changed
                 or not (networking_gif0_probe.matches | default(true)))
             else [])
          + (['lo0'] if (networking_rc_vip4 is changed or networking_rc_vip6 is changed) else []))
         | unique }}

# `service netif restart gif0` exits 0 even when an ifconfig it runs fails
# (network.subr ifconfig_up ignores its status), so a tunnel that did not apply
# stops the run here, before the record below would mark it applied.
- name: Check gif0 after the restart (GRE, FreeBSD)
  gif_status:
    name: gif0
    tunnel: "{{ networking_gre_tunnel }}"
    inet6: "{{ gre_inner_ipv6 }}"
  register: networking_gif0_after
  when: egress_mode == 'gre' and not ansible_check_mode

- name: Require gif0 to run its configuration (GRE, FreeBSD)
  ansible.builtin.assert:
    that: networking_gif0_after.matches
    fail_msg: >-
      gif0 is not up with the tunnel and inner address rc.conf gives it after
      `service netif restart gif0`, which exits 0 even when the ifconfig it runs
      fails (a tunnel address pair another gif interface holds, for one). Check
      gre_local_ip6, gre_remote_ip6, gre_inner_ipv6. Wanted: tunnel {{ networking_gre_tunnel | join(' --> ') }}, inet6
      {{ gre_inner_ipv6 }}. Running: tunnel
      {{ (networking_gif0_after.tunnel | join(' --> ')) or 'none' }}, inet6
      {{ (networking_gif0_after.inet6 | join(', ')) or 'none' }}.
    quiet: true
  when: egress_mode == 'gre' and not ansible_check_mode

# After the restarts and the check: a restart that failed or never ran, or a
# tunnel that did not apply, keeps the old record.
- name: Record the applied interface state (FreeBSD)
  ansible.builtin.copy:
    dest: "{{ networking_netif_state_file }}"
    content: "{{ networking_netif_desired | to_nice_json }}\n"
    owner: root
    group: wheel
    mode: "0644"

# After the restart, which creates gif0 in GRE mode and, when gif0 existed,
# destroyed it first and dropped every route through it.
- name: Apply multicast route immediately (FreeBSD)
  ansible.builtin.command:
    argv:
      - route
      - add
      - -inet6
      - -net
      - "{{ networking_mc_route_prefix }}"
      - -interface
      - "{{ networking_egress_iface }}"
  register: networking_mc_route_result
  changed_when: networking_mc_route_result.rc == 0
  # route(8) reports an existing route on stderr ("message indicates error: File
  # exists" over netlink, "writing to routing socket: File exists" over rtsock)
  # and on stdout ("... route already in table"); any other error stays fatal.
  failed_when: >-
    networking_mc_route_result.rc != 0
    and 'File exists' not in networking_mc_route_result.stderr
    and 'already in table' not in networking_mc_route_result.stdout

# A route for the prefix can already exist through another interface (egress_iface
# or egress_mode changed while the old interface stays up): move it here.
- name: Look up the existing multicast route (FreeBSD)
  ansible.builtin.command:
    argv: [route, -n, get, -inet6, -net, "{{ networking_mc_route_prefix }}"]
  register: networking_mc_route_get
  changed_when: false
  failed_when: false
  when: (networking_mc_route_result.rc | default(0)) != 0

- name: Move the multicast route to the egress interface (FreeBSD)
  ansible.builtin.command:
    argv: [route, change, -inet6, -net, "{{ networking_mc_route_prefix }}", -interface, "{{ networking_egress_iface }}"]
  changed_when: true
  when: >-
    (networking_mc_route_result.rc | default(0)) != 0
    and networking_mc_route_get.stdout is not search('^\s*interface: ' ~ (networking_egress_iface | regex_escape) ~ '\s*$',
                                                     multiline=True)
