---
# ============================================================
# ingress-infra Ansible group_vars/all.yml
# Override any variable per-host in inventory/hosts.yml
# ============================================================

# ------------------------------------------------------------
# shard-proxy source and build
# ------------------------------------------------------------
proxy_repo: "https://github.com/lightwebinc/shard-proxy.git"
# Pin to the latest shard-proxy release tag; avoid "main" in production.
proxy_version: "v1.13.0"
proxy_install_dir: "/opt/shard-proxy"
proxy_bin_dir: "/usr/local/bin"
proxy_user: "shard-proxy"
proxy_group: "shard-proxy"
# Push a locally pre-built binary instead of clone+build (empty = build from
# source on the host). Set to a local path, e.g. "files/shard-proxy-freebsd".
proxy_local_binary: ""
# Force a rebuild even when a binary already exists in proxy_install_dir.
proxy_force_build: false

# Go toolchain version (used when building from source)
go_version: "1.25.10"
go_install_dir: "/usr/local/go"

# ------------------------------------------------------------
# Proxy runtime configuration
# All flags have env-var equivalents set in the service unit
# ------------------------------------------------------------
listen_addr: "[::]"
udp_listen_port: 8725
tcp_listen_port: 0
# Push-frame ingest (replaces the deprecated miner multicast port, 2026-07-07).
# The user ports above are transaction-only; blocks and subtrees enter as
# header-stripped BRC-144 / BRC-143 PUSH frames on dedicated TCP ports, reframed
# to the fabric internally. Privileged and tunnel-bound — restrict to miner-tier
# sources at the firewall / provider ACL (see docs/networking.md); only 8725 is
# public. Standard numbers: 8726 subtree, 8727 block. 0 = disabled.
subtree_listen_port: 0
block_listen_port: 0
# BRC-148 BEEF object plane. BEEF is an OPEN class: submission records
# (0xBEEF-tagged) and framed FrameVer 0x09 ride the public tx port 8725
# regardless of beef_listen_port, which only opens an OPTIONAL dedicated lane
# (standard 8728) for flow separation / load balancing — never admission.
# 0 = no dedicated lane. beef_shard_bits (1-12) sizes the plane band
# (0x1000 + 2^bits groups); beef_max_object_bytes bounds one accepted object.
beef_listen_port: 0
beef_shard_bits: 4
beef_max_object_bytes: 1048576
# Permissionless PoW gate on BRC-131 block announces (validates work, not
# identity). DEFAULT ON — matches the shard-proxy binary default
# (-require-block-pow / REQUIRE_BLOCK_POW = true). Set false only for lab
# fixtures that emit announces carrying no real work.
require_block_pow: true
# Difficulty floor for the gate, in Bitcoin compact nBits form:
#   "0x1d00ffff"  mainnet / testnet
#   "0x207fffff"  devnet / regtest
#   "0"           no floor — header self-consistency only (still gated)
min_pow_bits: "0"
egress_port: 9001
# IPV6_MULTICAST_HOPS on egress. 1 = single L2 segment (binary default,
# non-breaking). Set to 64 for a routed / ip6gre-mesh fabric so egress
# multicast frames survive past the first hop (cross-tunnel).
proxy_egress_hoplimit: 1
# IPV6_MULTICAST_LOOP on egress. Only needed on collapsed/mesh router nodes
# so locally-originated multicast is forwarded by the kernel MFC.
egress_multicast_loop: false
shard_bits: 2
mc_scope: "site"
mc_group_id: "0x000B"
# Multicast addressing model: asm (default) | ssm (FF3x::/32 per RFC 4607;
# requires PIM-SSM in the fabric). bind_source is required and MUST be a
# unique IPv6 literal per replica when source_mode is ssm.
source_mode: "asm"
bind_source: ""
# Authoritatively stamp the BRC HashKey from the observed packet source IP.
# Set false only behind a source-rewriting load balancer.
stamp_source: true
num_workers: 0
# Datagrams per recvmmsg syscall (1 = per-packet legacy path).
recv_batch: 32
metrics_addr: ":9100"
otlp_endpoint: ""
otlp_interval: "30s"
# Unified logging — see shard-common/docs/logging.md
log_format: "json"            # text | json (json for fleet aggregation; collector phase is deferred)
log_level: "info"             # debug|info|warn|error; runtime-togglable via POST /loglevel + SIGHUP
trace_sampling: 0             # 0..1 trace head sampling (0 = off; exports via otlp_endpoint; control-plane only)
drain_timeout: "0s"           # Pre-drain delay on shutdown; set to ≥ LB health-check interval in production
frag_mtu: 0                   # BRC-130 fragmentation MTU (0 = disabled)
# BRC-142 frame coalescing — pack many small same-(group,subtree) txs per
# datagram to cut fabric pps. Coalesce at the ORIGIN, i.e. this ingress tier.
coalesce: false               # opt-in (binary default off)
coalesce_max_bytes: 1500      # max bundle datagram size (1500 Ethernet, 9000 jumbo)
coalesce_max_members: 0       # max member txs per bundle (0 = MTU-bound)
coalesce_carry_txid: false    # carry per-member TxID (dedup/billing) vs recompute
proxy_debug: false

# Two-tier ingress TxID deduplication (proxy-side)
# tier-1: in-process LRU (always active when txid_dedup_local_cap > 0)
# tier-2: modular shard-common/cache backend SETNX (memory|redis|aerospike)
# Set txid_dedup_local_cap: 0 to disable ingress dedup entirely.
# See shard-common/docs/cache-backend.md
txid_dedup_local_cap: 1048576   # tier-1 LRU capacity; 0 = disable
txid_dedup_backend: ""          # redis|aerospike|memory|none; empty infers redis when addr set, else none
txid_dedup_redis_addr: ""       # Redis/Valkey/Dragonfly addr; empty = local-only
txid_dedup_aerospike_hosts: ""  # comma-separated host:port (required when backend=aerospike)
txid_dedup_aerospike_namespace: "cache"
txid_dedup_aerospike_set: "bsp"
txid_dedup_prefix: "bsp:tx:"   # key prefix — must match listener's ingress_set_prefix
txid_dedup_ttl: "10m"           # tier-2 entry TTL

# ------------------------------------------------------------
# Networking
# ------------------------------------------------------------
egress_mode: "ethernet"       # ethernet | gre
egress_iface: "eth1"          # interface name or list of names

# Multicast route prefix for the egress interface.
# Defaults to "" which means auto-derive from mc_scope:
#   link   -> ff02::/16
#   site   -> ff05::/16
#   org    -> ff08::/16
#   global -> ff0e::/16
# Override this when using a narrower assigned prefix (mc_group_id set).
mc_route_prefix: ""

# GRE tunnel (only used when egress_mode == gre)
# The fabric is IPv6-only: local/remote endpoints are IPv6 addresses,
# the tunnel mode is ip6gre (Linux) / gif (FreeBSD).
gre_local_ip6: ""         # IPv6 address of the local tunnel endpoint
gre_remote_ip6: ""        # IPv6 address of the remote tunnel endpoint
gre_iface: "gre6-bsp"     # interface name for the tunnel
gre_inner_ipv6: ""        # IPv6 address/prefix assigned inside the tunnel

# ------------------------------------------------------------
# BGP (optional)
# ------------------------------------------------------------
enable_bgp: false
bgp_daemon: "bird2"           # bird2 | frr

bgp_prefix: []               # IPv4 BGP prefixes announced by all nodes, e.g. ["192.0.2.0/24"]
bgp_vip: ""                  # IPv4 loopback VIP, e.g. "192.0.2.1"
bgp_prefix6: []              # IPv6 BGP prefixes announced by all nodes, e.g. ["2001:db8::/48"]
bgp_vip6: ""                 # IPv6 loopback VIP, e.g. "2001:db8::1"

bgp_local_as: 65001
bgp_peer_as: 65000
bgp_peer_ip: ""               # IPv4 BGP peer address (leave empty if peer is v6-only)
bgp_peer_ip6: ""              # IPv6 BGP peer address
bgp_router_id: "{{ ansible_default_ipv4.address }}"
bgp_hold_time: 90
bgp_keepalive: 30
bgp_password: ""
# Health path the bsp-bgp-check timer probes to enable/withdraw the anycast VIP.
# /healthz (liveness) = withdraw when the proxy is dead; /readyz = withdraw at
# drain start (graceful anycast shed for a hostNetwork proxy pod). See I1.
bgp_health_path: "/healthz"

# iBGP peers (used by the bgp-ibgp role, playbook: bgp-ibgp.yml)
# Each entry: { peer_ip: "", peer_ip6: "", description: "" }
# At least one of peer_ip or peer_ip6 is required per entry.
# Include both for dual-stack peers.
bgp_ibgp_peers: []
