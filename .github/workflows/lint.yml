name: Lint

on:
  # main only. `branches: ["**"]` alongside pull_request ran this twice for
  # every PR, once for the branch push, once for the PR, and the
  # concurrency group cannot dedupe them: github.ref differs between the
  # two events. The PR trigger still covers branches, and it is the run
  # that gates the merge.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible:
    uses: lightwebinc/ci/.github/workflows/ansible-lint.yml@fcb564d49f07d6002441feb9d97ae3ce561e0f17 # v0.6.2

  terraform:
    uses: lightwebinc/ci/.github/workflows/terraform.yml@fcb564d49f07d6002441feb9d97ae3ce561e0f17 # v0.6.2
    with:
      dirs: '["terraform/modules/ingress-node", "terraform/modules/bgp-anycast", "terraform/examples/generic", "terraform/examples/aws-ec2"]'
      trivyignores: terraform/examples/aws-ec2/.trivyignore

